name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  go:
    name: Go (${{ matrix.go }})
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        go: ['1.22.x', stable]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ matrix.go }}
          cache: false # No external Go dependencies or go.sum.
      - name: Install integration-test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends rsync openssh-server
          npm install --global pnpm@9
      - name: Test with race detection
        run: go test -race ./... -count=1 -timeout=10m
      - name: Vet
        run: go vet ./...

  bash:
    name: Patched Bash integration
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Install test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential rsync
          mkdir -p /tmp/opencode
      - name: Build and test patched Bash
        shell: bash
        run: |
          go build -o "$RUNNER_TEMP/switchyard" ./cmd/switchyard
          scripts/build-switchyard-bash.sh | tee "$RUNNER_TEMP/bash-build.txt"
          bash_binary=$(sed -n 's/^Switchyard Bash: //p' "$RUNNER_TEMP/bash-build.txt")
          test -x "$bash_binary"
          scripts/test-switchyard-bash.sh "$bash_binary" "$RUNNER_TEMP/switchyard"
